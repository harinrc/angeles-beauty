<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ángeles Beauty</title>
    
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <main class="login-container">

        <form id="login-form" class="login-form">
            <h1 class="logo-texto">Ángeles Beauty</h1>
            <h2>Acceso de Administrador</h2>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="tu@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-whatsapp" style="width: 100%; border: none; cursor: pointer; padding: 12px;">
                Iniciar Sesión
            </button>

            <p id="error-message" class="error-texto"></p>
        </form>

    </main>

    <footer id="contacto" class="footer">
    <div class="footer-container">
        
        <div class="footer-section">
            <h4>Síguenos</h4>
            <div class="footer-social-icons">
                <a href="https://www.instagram.com/ange.les_beauty3667" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/@angelesnava48" target="_blank">
                    <i class="fab fa-tiktok"></i>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61585547381372" target="_blank">
                    <i class="fab fa-facebook"></i>
                </a>
            </div>
        </div>

        <div class="footer-section">
            <h4>Navegación</h4>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Quiénes Somos?</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </div>

    </div>

    <div class="footer-bottom">
        <p>&copy; 2026 Ángeles Beauty - Managua, Nicaragua.
            Creado con amor y dedicación❤️
        </p>
    </div>
</footer>

    <script type="module">
    
      // --- 1. INICIALIZACIÓN DE FIREBASE ---
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
      
      // ¡¡NUEVOS IMPORTS!! Importamos las funciones de Autenticación
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
      
      // ¡¡MUY IMPORTANTE!!
      // Pega aquí tu objeto 'firebaseConfig' (el mismo de index.html)
        const firebaseConfig = {
    apiKey: "AIzaSyAPUPxZNuJfX3KtiI1p73AAfDgNqVo8a-g",
    authDomain: "tienda-angeles-beauty.firebaseapp.com",
    projectId: "tienda-angeles-beauty",
    storageBucket: "tienda-angeles-beauty.firebasestorage.app",
    messagingSenderId: "913588395045",
    appId: "1:913588395045:web:ce50c2f7a296c85ecff3cc"
  };

      // Inicializa Firebase App
      const app = initializeApp(firebaseConfig);
      
      // ¡¡NUEVO!! Inicializa Firebase Authentication
      const auth = getAuth(app);


      // --- 2. LÓGICA DEL FORMULARIO DE LOGIN ---
      
      // Espera a que la página se cargue
      window.addEventListener('DOMContentLoaded', () => {
        
        const loginForm = document.querySelector('#login-form');
        const errorMsg = document.querySelector('#error-message');

        if (loginForm) {
            
            // Escuchamos el evento "submit" (cuando se presiona el botón)
            loginForm.addEventListener('submit', async (e) => {
                
                // Prevenimos que la página se recargue (¡vital!)
                e.preventDefault(); 
                
                // 1. Obtenemos los valores del formulario
                const email = loginForm.email.value;
                const password = loginForm.password.value;
                
                try {
                    // 2. Intentamos iniciar sesión con Firebase
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    
                    // 3. ¡ÉXITO! El usuario es correcto
                    console.log("¡Login exitoso!", userCredential.user);
                    errorMsg.textContent = "¡Éxito! Redirigiendo...";
                    errorMsg.className = "exito-texto";
                    
                    // 4. Redirigimos al panel de admin
                    window.location.href = 'admin.html';
                    
                } catch (error) {
                    // 5. ¡FALLO! El usuario o contraseña son incorrectos
                    console.error("Error en el login:", error.code);
                    errorMsg.textContent = "Error: Correo o contraseña incorrectos.";
                    errorMsg.className = "error-texto";
                }
            });
        }
      });

    </script>

</body>
</html>
